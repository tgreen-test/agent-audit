name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: packages/audit
        run: poetry install

      # Both test roots. packages/audit/tests/ (32 tests) was never run by CI and could
      # not even be collected — see NIGHT_RUN_LEDGER.md W2.
      - name: Run tests
        working-directory: packages/audit
        run: poetry run pytest ../../tests/ tests/ -v --cov=agent_audit --cov-report=xml

      # Guard for W2: the root suite used to import the package only because
      # tests/benchmark/performance_test.py happened to sort first and mutate sys.path
      # at import time. A subset run is the cheapest check that imports are declared
      # (root pytest.ini `pythonpath`) rather than inherited by accident.
      - name: Run a test subset (import-path regression guard)
        working-directory: packages/audit
        run: poetry run pytest ../../tests/test_scanners/ -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/audit/coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff mypy types-PyYAML

      - name: Run ruff
        run: ruff check packages/audit --output-format=github

      - name: Run mypy
        run: mypy packages/audit/agent_audit --ignore-missing-imports

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install agent-audit
        working-directory: packages/audit
        run: poetry install

      - name: Run agent-audit self-scan
        working-directory: packages/audit
        # Findings must not fail CI (the self-scan trips its own regex patterns), but a
        # scanner *crash* must. A bare `|| true` made those indistinguishable: no SARIF
        # was produced, the upload step swallowed the miss via continue-on-error, and a
        # completely broken scanner looked like a clean run. Same failure family as the
        # benchmark adapter in NIGHT_RUN_LEDGER.md W0.
        run: |
          set +e
          poetry run agent-audit scan . --format sarif --output agent-audit-results.sarif
          rc=$?
          set -e
          echo "agent-audit exited $rc"
          if [ ! -s agent-audit-results.sarif ]; then
            echo "::error::self-scan produced no SARIF output (exit $rc) — the scanner did not run"
            exit 1
          fi
          python -c "import json,sys; json.load(open('agent-audit-results.sarif'))" \
            || { echo "::error::self-scan SARIF is not valid JSON"; exit 1; }

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: packages/audit/agent-audit-results.sarif
        # Retained deliberately: upload-sarif fails on forks and when code-scanning
        # permissions are unavailable. The scan itself is now hard-gated above, so this
        # no longer hides a broken scanner — only a publishing-side limitation.
        continue-on-error: true
