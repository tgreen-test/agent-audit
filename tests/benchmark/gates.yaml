# Quality gates for agent-audit — THE SINGLE SOURCE OF TRUTH.
# Version: 3.0 | Date: 2026-08-11
#
# Supersedes tests/benchmark/quality_gates_v2.yaml, which nothing references any
# more. Until then there were TWO gates on Layer 1 with different numbers:
#   - an inline gate in .github/workflows/benchmark.yml : P 0.72 / R 0.80 / F1 0.75
#   - quality_gates_v2.yaml                             : P 0.90 / R 0.85 / F1 0.87
# Two gates on one layer is how that contradiction survived six months. The
# inline gate is deleted and the workflow calls quality_gate_check.py against
# this file.
#
# Two tiers, and the distinction is load-bearing:
#   thresholds:  the ratchet. Blocks CI. Its only job is catching regression.
#   target:      aspirational. Reported, never blocks.

version: "3.0"
last_updated: "2026-08-11"

# Layer 1: synthetic sample precision/recall
layer1:
  enabled: true
  blocking: true

  # RATCHET — blocks CI. Derived from the measurement in NIGHT_RUN_LEDGER.md
  # § W12: P 0.6829 / R 0.8305 / F1 0.7495, minus a 0.02 margin, truncated to
  # two decimals. Re-derive and RAISE these whenever a change moves the
  # measurement up. Never lower them to make a build pass.
  #
  # Measured 2026-08-11 at commit cca9265, after two fixes that moved the number
  # for reasons unrelated to detection quality:
  #   - the MCP discovery fix (f649dcc) made 20 previously-unreachable findings
  #     possible. 19 of them the corpus does not label, so precision FELL,
  #     0.7303 -> 0.6829, while recall rose 0.8263 -> 0.8305. That is a labelling
  #     artifact, not a regression, and it is why this floor sits below the old
  #     inline 0.72.
  #   - the evaluator was non-deterministic until cca9265, so every Layer 1
  #     figure recorded before it carries about +/-1 TP of unquantified noise.
  thresholds:
    precision_min: 0.66
    recall_min: 0.82
    f1_min: 0.73

  # RATCHET, per ASI category. Same derivation: measured minus 0.02, truncated.
  # ASI-03/04/07 are low because of the label defects catalogued in DECISIONS.md
  # item 9 — one detection counted as both a false positive and a false negative
  # — not because those categories are undetectable. Raise them once the labels
  # are settled; correcting the nine known mislabels alone is worth about
  # +0.03 precision and +0.04 recall overall, with no scanner change.
  per_asi_recall_min:
    ASI-01: 0.86    # measured 0.8846
    ASI-02: 0.78    # measured 0.8000
    ASI-03: 0.35    # measured 0.3750
    ASI-04: 0.12    # measured 0.1429  (was 0.0000 before the MCP discovery fix)
    ASI-05: 0.76    # measured 0.7857
    ASI-06: 0.75    # measured 0.7778
    ASI-07: 0.60    # measured 0.6250
    ASI-08: 0.95    # measured 0.9767
    ASI-09: 0.91    # measured 0.9375
    ASI-10: 0.94    # measured 0.9655

  # TARGET — reported, never blocks. Kept visible so the ambition is not lost,
  # and annotated so nobody reinstates it as a gate by accident.
  #
  # Forensics, from NIGHT_RUN_LEDGER.md § SESSION 2:
  #   - never modified since quality_gates_v2.yaml was created at a65b341
  #     (2026-02-04);
  #   - the workflow step that evaluated it carried continue-on-error: true from
  #     birth until 2026-08-10, so it was never able to fail a build;
  #   - the results/layer1.json committed in that same commit reads R 0.4746
  #     against this 0.85 recall floor.
  # These numbers were never met, not even on the day they were written. This
  # was an aspiration recorded as a gate. Reading the ratchet above as a
  # "loosened standard" would be a misreading of that history.
  target:
    precision_min: 0.90
    recall_min: 0.85
    f1_min: 0.87
    fp_rate_max: 0.05

# Agent-Vuln-Bench: real vulnerability detection.
# Carried over unchanged from quality_gates_v2.yaml. Deliberately NOT ratcheted
# in this pass: AVB knowns currently measure R 1.000 / P 0.880, far above these
# floors, and tightening a second benchmark in the same commit that re-derives
# Layer 1 would make the next regression ambiguous between the two. Flagged in
# DECISIONS.md — a 0.60 recall floor under a 1.00 measurement will not catch a
# serious regression.
agent_vuln_bench:
  enabled: true
  blocking: true
  thresholds:
    overall_recall_min: 0.60
    set_a_recall_min: 0.70
    set_b_recall_min: 0.60
    set_c_recall_min: 0.50
    precision_min: 0.80
  regression:
    allow_regression: false
    baseline_file: "results/baseline.json"

# Layer 2: multi-target scan stability (report only).
#
# DISABLED, implementing the recommendation already recorded in DECISIONS.md
# item 3. results/layer2.json was created at a65b341 and has never been
# regenerated: it reports tool_version 0.5.0, a single target literally named
# "test1", and a round 150.0s duration. Evaluating it emitted two warnings
# ("OWASP coverage 5 < 10", "max scan time 150.0s > 120s") that describe
# agent-audit as it was in February, not as it is now — a false signal, and the
# only thing standing between this gate and a clean exit 0.
#
# Re-enable together with a regenerated results/layer2.json. Note that a missing
# file reports an honest SKIP rather than a warning, so deleting the placeholder
# would also be a defensible interim.
layer2:
  enabled: false
  blocking: false
  thresholds:
    owasp_coverage_min: 10
    max_scan_time_seconds: 120
