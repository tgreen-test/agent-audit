[pytest]
# The package under test lives at packages/audit/agent_audit, which is not on the
# default import path from the repo root. Historically the root suite imported it
# only by accident: tests/benchmark/performance_test.py matches the `*_test.py`
# collection glob, sorts first, and does a `sys.path.insert(...packages/audit)` at
# import time — so `pytest tests/` worked while `pytest tests/test_scanners/` failed
# with ModuleNotFoundError, and packages/audit/tests/ failed always.
#
# Declaring the path here makes imports deterministic for every subset and every
# test root, without sys.path manipulation inside test modules, and without
# depending on an editable install being present and correctly pointed.
pythonpath = packages/audit

# Registered so @pytest.mark.asyncio does not degrade to an unknown-mark warning
# (and silently-failing coroutine tests) when pytest-asyncio is missing.
markers =
    asyncio: mark test as an asyncio coroutine test (requires pytest-asyncio)
